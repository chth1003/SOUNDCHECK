<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form | Perfect Storm Launch Party</title>
    <meta name="description" content="Get your ticket for the Perfect Storm Launch Party." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/config.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/formular.js" defer></script>
  </head>
  <body data-page="formular">
    <div id="site-header"></div>

    <main id="main" class="page">
      <div class="container split">
        <div>
          <h1>Form</h1>
          <p class="intro">Select your ticket and fill out the form. Afterward, we will redirect you to the collection page, where you will receive your access card.</p>
        </div>

        <form id="rsvp" class="form-card" novalidate>
          <div class="field">
            <label for="guest-name">Your Name</label>
            <input id="guest-name" name="guest" type="text" autocomplete="name" maxlength="60" required aria-describedby="err-guest" />
            <p class="error" id="err-guest" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="guest-email">E-mail</label>
            <input id="guest-email" name="email" type="email" autocomplete="email" required aria-describedby="err-email" />
            <p class="error" id="err-email" aria-live="polite"></p>
          </div>

          <fieldset aria-describedby="err-pass">
            <legend>Select your pass</legend>
            <div class="pass-options">
              <label class="pass-option">
                <input type="radio" name="pass" value="stage" />
                <span class="pass-box"><strong>Stage Pass</strong><small>Close to the stage. You see everything and feel the sound.</small></span>
              </label>
              <label class="pass-option">
                <input type="radio" name="pass" value="floor" />
                <span class="pass-box"><strong>Eyewall Pass</strong><small>In the center of the dance floor, right in the heart of the storm.</small></span>
              </label>
              <label class="pass-option">
                <input type="radio" name="pass" value="lounge" />
                <span class="pass-box"><strong>Calm Pass</strong><small>Lounge with bar, sofas and photo wall.</small></span>
              </label>
            </div>
            <p class="error" id="err-pass" aria-live="polite"></p>
          </fieldset>

          <div class="field">
            <label for="guests">Number of guests</label>
            <select id="guests" name="guests">
              <option value="1">1 person</option>
              <option value="2">2 people</option>
              <option value="3">3 people</option>
              <option value="4">4 people</option>
            </select>
          </div>

          <button class="btn btn-primary" type="submit">Get my pass</button>
          <p class="form-note">School project: the information will not be stored or sent anywhere.</p>
        </form>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
